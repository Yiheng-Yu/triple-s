[package]
name = "triple-s-python"
version = "0.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "triple_s"
crate-type = ["cdylib"]

[profile.dev]
debug = "full"
opt-level = 0
overflow-checks = true
debug-assertions = true
split-debuginfo = "packed"
panic="unwind"
strip = "none"
lto = "off"

[profile.release]
debug = "none"
opt-level = "z"
overflow-checks = true
debug-assertions = false
incremental = false
strip = true
lto = "fat"
codegen-units = 1

[dependencies]
pyo3 = { version = "0.29.2", features = ["py-clone", "arc_lock", "experimental-inspect"] }
parking_lot = "0.12.5"

[dependencies.triple_s]
path = ".."

[features]
abi3 = ["pyo3/abi3", "pyo3/abi3-py310"]
