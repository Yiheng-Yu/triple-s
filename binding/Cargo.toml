[package]
name = "triple-s-python"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "triple_s"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["py-clone", "experimental-inspect"] }

[dependencies.triple_s]
path = ".."

[features]
abi3 = ["pyo3/abi3", "pyo3/abi3-py310"]