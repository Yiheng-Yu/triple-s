[package]
name = "triple_s"
version = "0.4.213"
edition = "2024"
description = "Read classic Triple-S survey definition files."
repository = "https://github.com/Yiheng-Yu/triple-s"
license-file = "LICENSE"
exclude = [
    "/.github/",
    "/.maturing/",
    "/python/",
    "/src_py/",
    "/pyproject.toml",
    "/rustfmt.toml",
    "/*.code-workspace",
    "/tests/*.py",
    "/tests/*.ipynb",
    "/tests/documentation/",
]

[package.metadata.docs.rs]
all-features = true

[profile.dev]
debug = "full"
strip = "none"
opt-level = 0
debug-assertions = true
overflow-checks = true
incremental = true
lto = "off"
panic = 'unwind'
codegen-units = 64

[profile.release]
debug = "none"
strip = "none"
opt-level = 3
debug-assertions = false
overflow-checks = true
incremental = false
lto = "fat"
codegen-units = 16

[profile.docs]
inherits = "dev"
debug = "none"
debug-assertions = false
overflow-checks = false
panic = "abort"
lto = "off"
opt-level = 0

[lib]
name = "triple_s"
crate-type = ["rlib"]

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
chrono = "0.4.45"
csv = "1.4"
parking_lot = { version = "0.13", features = ["arc_lock"] }
quick-xml = { version = "0.42.0", features = ["encoding"] }
rayon = "1.12.0"
regex = "1.13.1"
strum = { version = "0.28", features = ["derive"] }
pyo3 = { version = "0.29", features = [
    "py-clone",
    "arc_lock",
    "experimental-inspect",
    "anyhow",
    "chrono",
], optional = true }
log = "0.4.34"
polars = { version = "0.55", default-features = false, features = ["lazy", "parquet", "replace", "rows", "streaming", "fmt"] }
pyo3-polars = { version = ">=0.28.0", optional = true }
language-tags = "0.3.2"
tempfile = "3.27.0"
encoding_rs = "0.8.44"  
pyo3-log = { version = "0.13.5", optional = true }

[build-dependencies]
pyo3-build-config = { version = ">=0.29.2", features = [
    "resolve-config",
], optional = true }

[features]
default = []
pyo3 = [
    "dep:pyo3",
    "dep:pyo3-build-config",
    "dep:pyo3-polars",
    "dep:pyo3-log",
    "pyo3/abi3",
    "pyo3/abi3-py310",
]
