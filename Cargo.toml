[package]
name = "triple_s"
version = "0.4.2"
edition = "2024"
description = "Read classic Triple-S survey definition files."
repository = "https://github.com/Yiheng-Yu/triple-s"
license-file = "LICENSE"
exclude = [
    "/.github/",
    "/.maturing/",
    "/python/",
    "/src_py/",
    "/pyproject.toml",
    "/rustfmt.toml",
    "/*.code-workspace",
    "/tests/*.py",
    "/tests/*.ipynb",
    "/tests/documentation/",
]

[package.metadata.docs.rs]
all-features = true

[profile.dev]
opt-level = 0
debug = true
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.release]
strip = "none"
debug = "none"
opt-level = 3
overflow-checks = true
debug-assertions = false
incremental = false
lto = "thin"

[profile.docs]
inherits = "release"
opt-level = 0
lto = "off"
codegen-units = 16
debug = false

[profile.python-dev]
strip = "none"
debug = "full"
opt-level = 0
overflow-checks = true
debug-assertions = true
panic = "unwind"
lto = "off"
inherits = "dev"

[profile.python-release]
overflow-checks = true
debug-assertions = false
lto = "thin"
strip = "none"
inherits = "release"

[lib]
name = "triple_s"
crate-type = ["rlib"]


[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
chrono = "0.4.45"
csv = "1.4"
parking_lot = { version = "0.13", features = ["arc_lock"] }
quick-xml = { version = "0.42.0", features = ["encoding"] }
rayon = "1.12.0"
regex = "1.13.1"
strum = { version = "0.28", features = ["derive"] }
pyo3 = { version = "0.29", features = [
    "py-clone",
    "arc_lock",
    "experimental-inspect",
    "anyhow",
    "chrono",
], optional = true }
log = "0.4.34"
polars = { version = "0.55", default-features = false, features = ["lazy", "parquet", "streaming"] }
pyo3-polars = { version = ">=0.28.0", optional = true }
language-tags = "0.3.2"
tempfile = "3.27.0"
encoding_rs = "0.8.44"  
pyo3-log = { version = "0.13.5", optional = true }

[build-dependencies]
pyo3-build-config = { version = ">=0.29.2", features = [
    "resolve-config",
], optional = true }

[features]
default = []
pyo3 = [
    "dep:pyo3",
    "dep:pyo3-build-config",
    "dep:pyo3-polars",
    "dep:pyo3-log",
    "pyo3/abi3",
    "pyo3/abi3-py310",
]
