[package]
name = "triple_s"
version = "0.2.51"
edition = "2024"
description = "Read classic Triple-S survey definition files."
repository = "https://github.com/Yiheng-Yu/triple-s"
license-file = "LICENSE"
exclude = [
    "/.github/",
    "/.maturing/",
    "/python/",
    "/src_py/",
    "/pyproject.toml",
    "/rustfmt.toml",
    "/*.code-workspace",
    "/tests/*.py",
    "/tests/*.ipynb",
    "/tests/documentation/",
]

[profile.dev]
debug = "full"
opt-level = 0
overflow-checks = true
debug-assertions = true
split-debuginfo = "packed"
panic="unwind"
strip = "none"
lto = "off"

[profile.release]
debug = "none"
opt-level = "z"
overflow-checks = true
debug-assertions = false
incremental = false
strip = true
lto = "fat"
codegen-units = 1

[profile.python-dev]
debug = true
opt-level = 0
overflow-checks = true
debug-assertions = true
split-debuginfo = "packed"
panic="unwind"
strip = "none"
lto = "off"
inherits = "dev"

[profile.python-release]
debug = true
opt-level = "z"
overflow-checks = true
debug-assertions = false
incremental = false
strip = true
lto = "fat"
inherits = "release"
codegen-units = 1

[lib]
name = "triple_s"
crate-type = ["rlib"]

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
chrono = "0.4.45"
csv = "1.4"
parking_lot = { version = "0.13", features = ["arc_lock"] }
quick-xml = { version = "0.42.0", features = ["encoding", "serialize"] }
rayon = "1.12.0"
regex = "1.13.1"
strum = { version = "0.28", features = ["derive"] }
pyo3 = { version = "0.29", features = ["py-clone", "arc_lock", "experimental-inspect", "anyhow", "chrono"], optional = true }
log = "0.4.34"
polars = { version = "0.55", features = ["dtype-array"] }
pyo3-polars = { version = ">=0.28.0", optional = true }
language-tags = "0.3.2"

[build-dependencies]
pyo3-build-config = { version = ">=0.29.2", features = ["resolve-config"], optional = true }

[features]
default = []
pyo3 = ["dep:pyo3", "dep:pyo3-build-config", "dep:pyo3-polars", "pyo3/abi3", "pyo3/abi3-py310"]

[package.metadata.docs.rs]
all-features = true
