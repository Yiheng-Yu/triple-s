[package]
name = "triple_s"
version = "0.2.0"
edition = "2024"
description = "Read classic Triple-S survey definition files."
repository = "https://github.com/Yiheng-Yu/triple-s"

[lib]
name = "triple_s"
crate-type = ["rlib"]

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
pyo3 = "0.29.2"
quick-xml = { version = "0.42.0", features = ["encoding", "escape-html", "serialize"] }
rayon = "1.12.0"
regex = "1.13.1"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28.0"
