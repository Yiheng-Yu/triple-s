[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "triple-s-survey"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "pandas>=3.0.0",
    "polars>=1.44"
]
description = "A Rust-backed Python parser for Triple-S survey data and datamaps."
readme = "README.md"

[project.urls]
Homepage = "https://github.com/Yiheng-Yu/triple-s"
Repository = "https://github.com/Yiheng-Yu/triple-s"
Issues = "https://github.com/Yiheng-Yu/triple-s/issues"

[project.optional-dependencies]
testing = ["pytest", "lxml"]

[tool.maturin]
python-source = "src_py"
module-name = "triple_s"
bindings = "pyo3"
compatibility = "pypi"
strip = true
sdist-generator = "cargo"
features = ["pyo3", "pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]