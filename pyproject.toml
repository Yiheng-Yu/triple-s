[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triple_s"
description = "Read classic Triple-S survey definition files from Python."
readme = "README.md"
requires-python = ">=3.9"
version = "0.1.0"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

dependencies = []

[tool.setuptools.packages.find]
where = ["python"]

[project.urls]
Repository = "https://github.com/Yiheng-Yu/triple-s"
