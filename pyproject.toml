[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "triple-s-survey"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "pandas>=3.0.0",
    "polars>=1.44",
    "pyarrow >= 15.0.0"
]
description = "A Rust-backed Python parser for Triple-S survey data and datamaps."
readme = "README.md"
authors = [
    { name="Yiheng-Yu", email="yuyiheng1994@gmail.com" }
]
maintainers = [
    { name="Yiheng-Yu", email="yuyiheng1994@gmail.com" }
]
keywords = ["survey", "polars", "pandas", "data", "parser"]


[project.urls]
Homepage = "https://github.com/Yiheng-Yu/triple-s"
Repository = "https://github.com/Yiheng-Yu/triple-s"
Issues = "https://github.com/Yiheng-Yu/triple-s/issues"
Documentation = "https://triple-s.readthedocs.io/"

[project.optional-dependencies]
testing = ["pytest", "lxml"]

[tool.maturin]
python-source = "src_py"
module-name = "triple_s"
bindings = "pyo3"
compatibility = "pypi"
strip = false
sdist-generator = "cargo"
profile = "release"
editable-profile = "dev"
features = ["pyo3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--benchmark-columns=mean,min,max,stddev,rounds",
    "--benchmark-sort=mean",
    "--benchmark-name=short",
    "--benchmark-save=benchmark",
]

[tool.ruff]
force-exclude = true
extend-exclude = ["docs/conf.py"]
