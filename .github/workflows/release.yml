name: Publish release

on:
  push:
    branches:
      - release

permissions:
  contents: read

jobs:
  build-python:
    name: Build Python distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build source distribution
        run: uv build --sdist

      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --compatibility pypi --out dist
          manylinux: "2_28"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: release-build
      url: https://pypi.org/project/triple-s-survey/

    permissions:
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        run: uv publish

  build-docs:
    name: Build documentation after publishing to PyPI
    needs: publish-pypi
    uses: ./.github/workflows/docs.yml

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment:
      name: release-build
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crate
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

# Early Read the Docs webhook builds cancel until the wheel is available.
# build-docs triggers fresh builds after publication; docs.rs follows cargo publish.
