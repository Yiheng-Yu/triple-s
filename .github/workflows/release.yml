name: Publish release

on:
  push:
    branches:
      - release

permissions:
  contents: read

jobs:
  build-python:
    name: Build Python distributions (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build source distribution
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: uv build --sdist

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          SCCACHE_GHA_VERSION: ${{ github.workflow }}-${{ github.job }}-${{ matrix.target }}
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --compatibility pypi --out dist
          manylinux: "2_28"
          sccache: true

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ matrix.target }}
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: release-build
      url: https://pypi.org/project/triple-s-survey/

    permissions:
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: python-distributions-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        run: uv publish

  build-docs:
    name: Build documentation after publishing to PyPI
    needs: publish-pypi
    uses: ./.github/workflows/docs.yml
    secrets:
      READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment:
      name: release-build
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ github.workflow }}-rust

      - name: Publish crate
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

# Early Read the Docs webhook builds cancel until the wheel is available.
# build-docs triggers fresh builds after publication; docs.rs follows cargo publish.
